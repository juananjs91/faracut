name = "faracut-ia"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Créditos al mes según el permiso (entitlement) de RevenueCat
PLANS = '{"estudio":350,"pro":110,"creador":40}'
MODEL_VIDEO = "alibaba/wan-3.0/image-to-video"
MODEL_VIDEO_TEXT = "alibaba/wan-3.0/text-to-video"
MODEL_IMAGE = "fal-ai/flux-2-pro"

# El identificador del almacén se rellena solo al publicar desde GitHub Actions.
[[kv_namespaces]]
binding = "DATA"
id = "KV_ID"
