<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaraCut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: estudio de IA futurista, preciso y con energía, como las herramientas de vídeo con IA más nuevas
   IDEA: una consola de producción: cristal oscuro, luz de neón y un render que "se enciende"
   PICTURE: el escenario animado brilla dentro de un marco luminoso, como la pantalla de un renderizador
   COLOUR and TYPE: casi negro #07080f, cian eléctrico #22d3ee, violeta #8b5cf6, acento lima #a3ff5c; Sora + Inter
   LAYOUT: carcasa de app móvil (máx. 520px), barra de pestañas flotante de cristal; misma paleta de noche siempre */
:root{color-scheme:dark;--bg:#07080f;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--ink:#eef1ff;--mute:#8b93b5;
--cy:#22d3ee;--vi:#8b5cf6;--lime:#a3ff5c;--grad:linear-gradient(120deg,#22d3ee,#8b5cf6 60%,#d946ef);--ok:#a3ff5c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#03040a;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:radial-gradient(120% 60% at 100% 0,rgba(139,92,246,.28),transparent 60%),radial-gradient(90% 50% at 0 30%,rgba(34,211,238,.16),transparent 60%),var(--bg);display:flex;flex-direction:column;position:relative}
.app::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(#000,transparent 55%);pointer-events:none}
header{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;background:rgba(7,8,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 10px rgba(34,211,238,.55))}
header h1{font:800 22px/1 Sora,sans-serif;margin:0;flex:1;letter-spacing:-.02em}
header h1 em{font-style:normal;font-size:11px;font-weight:800;vertical-align:middle;margin-left:6px;padding:3px 7px;border-radius:6px;background:var(--grad);color:#07080f}
.cred{background:rgba(163,255,92,.1);color:var(--lime);border:1px solid rgba(163,255,92,.35);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;min-height:36px;box-shadow:0 0 14px -4px rgba(163,255,92,.6)}
main{flex:1;padding:18px 16px 110px;position:relative}
h2{font:800 30px/1.08 Sora,sans-serif;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,#c9d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
label{display:block;font-weight:600;font-size:13px;color:var(--mute);margin:12px 0 5px}
input,textarea,select{width:100%;font:16px Inter,sans-serif;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);min-height:46px}
input[type=color]{padding:4px}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.18);outline:none}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button{font:700 15px Inter,sans-serif;cursor:pointer;border-radius:14px;min-height:46px;padding:0 16px;border:0;transition:transform .15s,box-shadow .2s}
button:active{transform:scale(.97)}
.btn{background:var(--grad);color:#fff;box-shadow:0 8px 24px -10px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:hover{box-shadow:0 10px 30px -8px rgba(34,211,238,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.btn2{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;background:none;color:var(--mute);min-height:40px;font-size:14px}
.seg button[aria-pressed=true]{background:rgba(34,211,238,.14);color:var(--cy);box-shadow:inset 0 0 0 1px rgba(34,211,238,.5),0 0 18px -6px rgba(34,211,238,.8)}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#111;margin:0 auto 14px;padding:0;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 40px -10px rgba(139,92,246,.7),0 0 60px -20px rgba(34,211,238,.6)}
.stage::after{content:"";position:absolute;inset:0;border-radius:20px;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.stage svg{display:block;width:100%;height:100%}
.v{aspect-ratio:9/16;max-width:300px}.h{aspect-ratio:16/9;width:100%}
.cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(7,8,15,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);color:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:600;text-align:center}
.bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.bob.b2{animation-delay:-.5s}.bob.b3{animation-delay:-.25s}
@keyframes bob{50%{transform:translateY(-6%)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:4px 12px 4px 4px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:36px;color:var(--ink)}
.chip[aria-pressed=true]{border-color:var(--cy);background:rgba(34,211,238,.12);box-shadow:0 0 14px -6px var(--cy)}
.dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:0 0 12px -2px currentColor,inset 0 -3px 6px rgba(0,0,0,.25)}
.scene{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.num{width:34px;height:34px;border-radius:11px;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.5);color:#d8ccff;font:800 15px Sora,sans-serif;display:grid;place-items:center}
.st{font-size:12px;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.st.ready{color:var(--lime);border-color:rgba(163,255,92,.4);background:rgba(163,255,92,.08)}
.st.gen{color:var(--cy);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.st.draft{color:var(--mute)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .25s;box-shadow:0 0 12px var(--cy)}
.mini{font-size:13px;color:var(--mute)}
.warn{background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.25);color:#cfeff7;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;background:rgba(18,20,34,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;z-index:6;box-shadow:0 12px 40px -10px rgba(0,0,0,.8)}
nav button{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px;min-height:54px;border-radius:16px}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--cy);background:rgba(34,211,238,.1);box-shadow:inset 0 0 0 1px rgba(34,211,238,.3)}
nav button[aria-current=page] svg{filter:drop-shadow(0 0 6px var(--cy))}
.plan{position:relative}.plan.best{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 0 40px -14px rgba(139,92,246,.9)}
.price{font:800 30px/1 Sora,sans-serif;white-space:nowrap;letter-spacing:-.03em}
.plan ul{margin:10px 0 14px;padding-left:20px;color:#c9cfe8}
.plan li::marker{color:var(--cy)}
.tag{display:inline-block;background:var(--grad);color:#fff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(18,20,34,.9);border:1px solid rgba(34,211,238,.4);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center;box-shadow:0 0 24px -8px var(--cy)}
.toast.on{opacity:1}
.prog{height:4px;background:rgba(255,255,255,.15);position:absolute;top:0;left:0;right:0;z-index:2}.prog i{display:block;height:100%;background:var(--grad);width:0;box-shadow:0 0 10px var(--cy)}
.empty{text-align:center;color:var(--mute);padding:20px}
.gen-on{position:relative;overflow:hidden}
.gen-on::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(34,211,238,.12) 50%,transparent 70%);animation:scan 1.4s linear infinite;pointer-events:none}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.bob,.gen-on::after{animation:none}}
.hero h2{font-size:34px}
.sec{font:700 19px Sora,sans-serif;margin:26px 0 12px;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:var(--ink);min-height:150px;font:inherit}
.tile:hover{border-color:rgba(34,211,238,.45);box-shadow:0 0 24px -10px var(--cy)}
.tile svg{width:56px;height:56px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));margin-bottom:4px}
.tile b{font:700 15px/1.2 Sora,sans-serif}.tile span{font-size:13px;line-height:1.35;color:var(--mute)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute)}
.step b{color:var(--ink);font:700 15px Sora,sans-serif;margin-top:6px}
.cont{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;color:var(--ink);font:inherit;padding:10px}
.thumb{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 8px 18px -8px rgba(0,0,0,.7)}
.thumb svg{display:block;width:100%;height:100%}
.thumb.h{width:120px;aspect-ratio:16/9}.thumb.v{width:68px;aspect-ratio:9/16}
.thumb .num{position:absolute;top:5px;left:5px;width:24px;height:24px;font-size:12px;border-radius:8px;background:rgba(7,8,15,.75)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.pt svg{display:block;width:100%;aspect-ratio:1}
.cb{padding:10px 12px 12px}.cb b{font:700 16px Sora,sans-serif}.cb .mini{min-height:36px}
.sm{min-height:36px;font-size:13px;margin-top:8px;width:100%}
.ic{width:46px;padding:0}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.place{min-height:64px;border-radius:14px;position:relative;color:#fff;font-size:13px;display:flex;align-items:flex-end;justify-content:center;padding:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.place span{background:rgba(7,8,15,.6);border-radius:8px;padding:1px 8px}
.place[aria-pressed=true]{box-shadow:0 0 0 2px var(--cy),0 0 18px -4px var(--cy)}
@media(max-width:380px){nav button{font-size:10px}.thumb.h{width:96px}}

.scn{position:relative;overflow:hidden;background:#1b2140;width:100%;height:100%;container-type:size}
.scn .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scn .ch{position:absolute;bottom:7%;transform:translateX(-50%);transform-origin:bottom center;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));animation:bob2 1.2s ease-in-out infinite;pointer-events:none;max-width:none}
.scn.v .ch{bottom:12%}
.scn .ch.b2{animation-delay:-.4s}.scn .ch.b3{animation-delay:-.8s}
@keyframes bob2{50%{transform:translateX(-50%) translateY(-4%) scaleY(1.02)}}
.stage canvas{display:block;width:100%;height:100%}
.pt{aspect-ratio:1;overflow:hidden;position:relative}
.pt img{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);height:88%;width:auto;max-width:none;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4))}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--cy)}
.preview{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;margin-top:12px}
.preview .pt{border-radius:18px}
.kinds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kinds button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:86px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--mute);font-size:12px}
.kinds img{height:46px;width:auto;max-width:100%;object-fit:contain}
.kinds button[aria-pressed=true]{border-color:var(--cy);color:var(--cy);background:rgba(34,211,238,.1)}
.place{background-size:cover;background-position:center 60%}
.recov{position:absolute;inset:0;background:rgba(7,8,15,.75);display:grid;place-items:center;text-align:center;padding:16px;z-index:3;font-weight:700}
.chip img{width:28px;height:28px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,.08)}

.eyebrow{margin:0 0 6px;font:700 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.hero h2{font-size:31px}
figure.stage{margin:0 0 12px}
figure.stage figcaption{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(7,8,15,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font:700 12px Inter,sans-serif;letter-spacing:.02em}
.showgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.showgrid figure.stage{margin:0;border-radius:16px}.showgrid figure.stage::after{border-radius:16px}
.show{position:absolute;inset:0;overflow:hidden}
.show .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh-rocket .rk{position:absolute;left:50%;bottom:24%;height:46%;aspect-ratio:298/458;transform:translateX(-50%);animation:liftoff 7s cubic-bezier(.55,0,.8,.4) infinite}
.sh-rocket .rk .body{position:absolute;inset:0;width:100%;height:100%}
.sh-rocket .rk .fl{position:absolute;left:50%;top:88%;width:46%;transform:translateX(-50%) scaleY(.2);transform-origin:top center;opacity:0;animation:flame 7s linear infinite}
@keyframes liftoff{0%,32%{transform:translateX(-50%) translateY(0)}34%,36%{transform:translateX(-49%) translateY(-1%)}35%,37%{transform:translateX(-51%) translateY(-1%)}92%{transform:translateX(-50%) translateY(-260%);opacity:1}93%{opacity:0}100%{transform:translateX(-50%) translateY(0);opacity:0}}
@keyframes flame{0%,22%{opacity:0;transform:translateX(-50%) scaleY(.2)}28%{opacity:1;transform:translateX(-50%) scaleY(.6)}30%,34%,38%,42%,50%,60%,70%,80%,90%{transform:translateX(-50%) scaleY(1.05)}32%,36%,40%,46%,55%,65%,75%,85%{transform:translateX(-50%) scaleY(.85)}92%{opacity:1}93%,100%{opacity:0}}
.sh-rocket .smoke{position:absolute;left:50%;bottom:21%;width:42%;height:14%;transform:translateX(-50%)}
.sh-rocket .smoke i{position:absolute;bottom:0;width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e9e4f2 60%,#cfc7de);opacity:0;animation:puff 7s ease-out infinite}
.sh-rocket .smoke i:nth-child(1){left:35%}.sh-rocket .smoke i:nth-child(2){left:10%;animation-delay:.15s}.sh-rocket .smoke i:nth-child(3){left:60%;animation-delay:.25s}.sh-rocket .smoke i:nth-child(4){left:-5%;animation-delay:.4s}.sh-rocket .smoke i:nth-child(5){left:75%;animation-delay:.5s}
@keyframes puff{0%,26%{opacity:0;transform:scale(.3)}34%{opacity:.95;transform:scale(1)}70%{opacity:.45;transform:scale(1.5) translateY(-10%)}92%,100%{opacity:0;transform:scale(1.8) translateY(-15%)}}
.sh-car .car{position:absolute;bottom:14%;height:30%;aspect-ratio:697/285;left:0;animation:drive 3.4s cubic-bezier(.4,.1,.6,.9) infinite}
.sh-car .car img{position:absolute;inset:0;width:100%;height:100%;animation:rumble .12s linear infinite}
.sh-car .lines{position:absolute;right:92%;top:20%;width:90%;height:55%;background:repeating-linear-gradient(180deg,transparent 0 14%,rgba(255,255,255,.85) 14% 18%,transparent 18% 30%);-webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000)}
@keyframes drive{0%{transform:translateX(-110%)}100%{transform:translateX(calc(100cqw + 10%))}}
@keyframes rumble{50%{transform:translateY(-1.5%)}}
.sh-car{container-type:inline-size}
.sh-swing .sw-box{position:absolute;left:50%;bottom:-2%;height:104%;aspect-ratio:1;transform:translateX(-50%)}
.sh-swing .sw-box img{position:absolute;inset:0;width:100%;height:100%}
.sh-swing .seat{transform-origin:50% 20.66%;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@media(prefers-reduced-motion:reduce){.sh-rocket .rk,.sh-rocket .fl,.sh-rocket .smoke i,.sh-car .car,.sh-car .car img,.sh-swing .seat{animation:none}.sh-rocket .smoke i{opacity:0}.sh-car .car{left:30%}}
</style>
</head>
<body>
<div class="app">
<header>
<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><polygon points="15,11 30,20 15,29" fill="#fff"/><circle cx="31" cy="10" r="3.5" fill="#a3ff5c"/></svg>
<h1>FaraCut<em>3D</em></h1>
</header>
<main id="view"></main>
<nav id="nav" aria-label="Secciones"></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
